# push마다 검사(테스트)와 안드로이드·윈도우·맥·리눅스 빌드를 자동으로 만듭니다.
# 만들어진 파일은 GitHub 저장소 > Actions > 해당 실행 > 맨 아래 "Artifacts"에서 내려받을 수 있어요.
name: 빌드와 검사

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.9"

defaults:
  run:
    working-directory: app

jobs:
  test:
    name: 검사(테스트·린트) + 리눅스 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 리눅스 빌드 도구 설치
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev libsecret-1-dev libstdc++-12-dev
      - run: flutter pub get
      - name: 포맷 검사
        run: dart format --output=none --set-exit-if-changed lib test
      - name: 린트
        run: flutter analyze
      - name: 테스트
        run: flutter test
      - name: 리눅스 빌드
        run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: linux-app
          path: app/build/linux/x64/release/bundle

  android:
    name: 안드로이드 빌드
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 설치 파일(APK) 만들기
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: 윈도우 빌드
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: app/build/windows/x64/runner/Release

  macos:
    name: 맥 빌드
    needs: test
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: 앱 묶기
        run: cd build/macos/Build/Products/Release && ditto -c -k --keepParent ai_chat_organizer.app ../../../../../macos-app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: app/macos-app.zip
