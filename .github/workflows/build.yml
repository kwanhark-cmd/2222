# push마다 검사(테스트)와 안드로이드·윈도우·맥·리눅스 빌드를 자동으로 만듭니다.
# 사용자용 설치 파일은 main에 새 버전이 올라오면 공개 Releases 화면에 올라가요(로그인 없이 내려받기):
#   https://github.com/kwanhark-cmd/2222/releases/latest
# 서명 키는 쓰지 않아요(주인의 결정). 그래서 안드로이드는 "백업 → 기존 앱 지우기 → 새로 설치 → 되살리기"로 바꿉니다.
name: 빌드와 검사

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.9"

defaults:
  run:
    working-directory: app

jobs:
  test:
    name: 검사(테스트·린트) + 리눅스 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 리눅스 빌드 도구 설치
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev libsecret-1-dev libstdc++-12-dev
      - run: flutter pub get
      - name: 포맷 검사
        run: dart format --output=none --set-exit-if-changed lib test
      - name: 린트
        run: flutter analyze
      - name: 테스트
        run: flutter test
      - name: 리눅스 빌드
        run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: linux-app
          path: app/build/linux/x64/release/bundle
      - name: 배포용 파일 만들기
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          cd build/linux/x64/release && zip -qr "$GITHUB_WORKSPACE/ai-chat-organizer-v$VER-linux.zip" bundle
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: ai-chat-organizer-v*-linux.zip

  android:
    name: 안드로이드 빌드
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 설치 파일(APK) 만들기
        # 도구(NDK) 내려받기가 가끔 깨져서 한 번 더 시도
        run: flutter build apk --release || (echo "한 번 더 시도해요" && sleep 30 && flutter build apk --release)
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
      - name: 배포용 파일 만들기
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/ai-chat-organizer-v$VER-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: ai-chat-organizer-v*-android.apk

  windows:
    name: 윈도우 빌드
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: app/build/windows/x64/runner/Release
      - name: 배포용 파일 만들기
        shell: pwsh
        run: |
          $ver = ((Get-Content pubspec.yaml | Select-String '^version:').ToString() -replace 'version: ','' -replace '\+.*','').Trim()
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "$env:GITHUB_WORKSPACE\ai-chat-organizer-v$ver-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: ai-chat-organizer-v*-windows.zip

  macos:
    name: 맥 빌드
    needs: test
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: 앱 묶기
        run: cd build/macos/Build/Products/Release && ditto -c -k --keepParent ai_chat_organizer.app ../../../../../macos-app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: app/macos-app.zip
      - name: 배포용 파일 만들기
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          cp macos-app.zip "$GITHUB_WORKSPACE/ai-chat-organizer-v$VER-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: ai-chat-organizer-v*-macos.zip

  # main에 올라온 새 버전은 GitHub Releases에도 올립니다(앱의 "업데이트 확인"이 여기를 봅니다).
  release:
    name: 새 버전 배포(Releases)
    needs: [test, android, windows, macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: 버전 읽기
        id: v
        run: |
          VER=$(grep '^version:' app/pubspec.yaml | sed 's/version: //; s/+.*//')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: 변경 내역(한국어) 꺼내기
        if: steps.v.outputs.exists == 'false'
        # 이미 설치된 앱은 업데이트 창에 이 글의 맨 위를 보여 줘요. 그래서 안드로이드 순서(백업 먼저)를 맨 위에 둡니다.
        run: |
          cat > notes.md <<'TXT'
          ### 안드로이드: 꼭 백업부터 하세요
          안드로이드는 새 버전을 기존 앱 위에 설치할 수 없어요. 기존 앱을 지우면 앱 안의 대화·주제·메모·설정도 함께 지워져요. 꼭 이 순서대로 해 주세요.
          1. 지금 쓰는 앱에서 설정 > 자료 관리 > 백업 파일 만들기를 누르고, 백업 파일을 "다운로드" 폴더처럼 앱 밖에 저장하기
          2. 아래 파일 중 android.apk로 끝나는 파일 내려받기
          3. 기존 앱 지우기
          4. 받은 파일을 눌러 설치하기
          5. 새 앱을 열고 첫 안내의 마지막 단계(또는 설정 > 자료 관리)에서 백업에서 되살리기. AI 열쇠는 다시 넣기
          이전 버전(1.1.0)의 안내 창에서는 "업데이트"를 누르지 말고 "아니요, 그만둘게요"를 누른 뒤 위 순서대로 해 주세요.

          TXT
          awk -v ver="## ${{ steps.v.outputs.version }}" 'index($0, ver)==1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > changes.md
          [ -s changes.md ] || echo "새 버전 ${{ steps.v.outputs.version }}" > changes.md
          cat changes.md >> notes.md
          cat >> notes.md <<'TXT'

          ### 컴퓨터(윈도우·맥·리눅스)
          자료는 사용자 폴더에 있어 앱 파일을 바꿔도 그대로 남아요.
          - 윈도우: windows.zip을 받아 압축을 풀고, 기존 앱 폴더와 바꿔 넣기 (앱 안 설정 > 업데이트 확인 > 업데이트로도 돼요)
          - 맥: macos.zip을 받아 풀고, 응용 프로그램 폴더의 기존 앱과 바꿔 넣기. 처음 열 때 막히면 시스템 설정 > 개인정보 보호 및 보안에서 "그래도 열기"
          - 리눅스: linux.zip을 받아 풀고, 기존 앱 폴더와 바꿔 넣기 (앱 안 업데이트로도 돼요)
          TXT
      - uses: actions/download-artifact@v4
        if: steps.v.outputs.exists == 'false'
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.exists == 'false'
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: AI 대화 기록 정리 비서 ${{ steps.v.outputs.version }}
          body_path: notes.md
          target_commitish: ${{ github.sha }}
          files: dist/*
